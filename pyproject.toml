[project]
name = "logit-lens-debugger"
version = "0.1.0"
description = "Logit Lens diagnostics for Hugging Face causal LMs (Qwen / Llama): layer-wise next-token predictions for debugging LLM applications."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
keywords = ["logit-lens", "interpretability", "llm", "debugging", "transformers", "qwen", "llama"]
dependencies = [
  "torch>=2.1",
  "transformers>=4.56",
  "safetensors>=0.4",
  "typer>=0.12",
]

[project.optional-dependencies]
viz = ["plotly>=5.18"]

[project.scripts]
logit-lens = "logit_lens_debugger.cli:app"

[dependency-groups]
dev = [
  "pytest>=8",
  "ruff>=0.6",
  "plotly>=5.18",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/logit_lens_debugger"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
  "integration: downloads and runs a real model (enable with LLD_RUN_INTEGRATION=1)",
]
filterwarnings = [
  "ignore::DeprecationWarning",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W"]

[tool.ruff.lint.per-file-ignores]
# typer's declarative style requires Option()/Argument() calls in defaults.
"src/logit_lens_debugger/cli.py" = ["B008"]
